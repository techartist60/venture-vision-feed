    <style>
      /* Initial atom splash — shown until React mounts. Invisible orbits, moving particles only. */
      #initial-atom-splash{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,#fff,#f7f9fc);z-index:9999;transition:opacity .35s ease}
      #initial-atom-splash svg{overflow:visible}
      #initial-atom-splash .atom-particle{fill:#1a6cff;filter:drop-shadow(0 0 4px #1a6cff) drop-shadow(0 0 8px rgba(26,108,255,.6))}
      #initial-atom-splash .atom-orbit{fill:none;stroke:rgba(26,108,255,.35);stroke-width:.6}
    </style>
  </head>

  <body>
    <div id="root">
      <div id="initial-atom-splash" aria-label="Loading Idestrim">
        <svg width="96" height="96" viewBox="0 0 100 100">
          <defs>
            <path id="splash-orbit-1" d="M 50,50 m -42,0 a 42,16 0 1,0 84,0 a 42,16 0 1,0 -84,0" fill="none" stroke="none"/>
            <path id="splash-orbit-2" d="M 50,50 m -42,0 a 42,16 0 1,0 84,0 a 42,16 0 1,0 -84,0" fill="none" stroke="none"/>
            <path id="splash-orbit-3" d="M 50,50 m -42,0 a 42,16 0 1,0 84,0 a 42,16 0 1,0 -84,0" fill="none" stroke="none"/>
          </defs>
          <g transform="rotate(0 50 50)"><ellipse class="atom-orbit" cx="50" cy="50" rx="42" ry="16"/></g>
          <g transform="rotate(60 50 50)"><ellipse class="atom-orbit" cx="50" cy="50" rx="42" ry="16"/></g>
          <g transform="rotate(120 50 50)"><ellipse class="atom-orbit" cx="50" cy="50" rx="42" ry="16"/></g>
          <g transform="rotate(0 50 50)"><circle class="atom-particle" r="3.4"><animateMotion dur="2.4s" repeatCount="indefinite"><mpath href="#splash-orbit-1"/></animateMotion></circle></g>
          <g transform="rotate(60 50 50)"><circle class="atom-particle" r="3"><animateMotion dur="2.9s" repeatCount="indefinite" keyPoints="1;0" keyTimes="0;1" calcMode="linear"><mpath href="#splash-orbit-2"/></animateMotion></circle></g>
          <g transform="rotate(120 50 50)"><circle class="atom-particle" r="3.2"><animateMotion dur="3.4s" repeatCount="indefinite"><mpath href="#splash-orbit-3"/></animateMotion></circle></g>
        </svg>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
